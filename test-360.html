<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360 배경 테스트 — 정비 VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1A1B1F; --sub: #6B6C72; }
  html, body { margin: 0; background: #fff; color: var(--ink); font-family: 'Pretendard', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .sec { padding: 72px 0; }
  .label { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; }
  h2 { margin: 0 0 12px; font-size: 32px; letter-spacing: -.02em; }
  .desc { margin: 0 0 28px; max-width: 640px; font-size: 16px; line-height: 1.6; color: #4A4B50; }

  .vr360 { position: relative; height: 640px; border-radius: 20px; overflow: hidden; background: #1b1f24; user-select: none; -webkit-user-select: none; outline: none; }
  .vr360 canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .vr360 .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #ddd; font-size: 15px; }
  /* 커버 플로 카드 */
  .cf-stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 45%; cursor: grab; touch-action: pan-y; z-index: 2; }
  .cf-stage.is-drag { cursor: grabbing; }
  .cf-card { position: absolute; left: 50%; top: 46%; margin: 0; transform-style: preserve-3d; will-change: transform, filter, opacity; cursor: pointer; }
  .cf-card img { display: block; width: 100%; height: auto; pointer-events: none; filter: drop-shadow(0 18px 36px rgba(0,0,0,.45)); }

  /* ── 정비 VR 패널: 피그마 원본 px 로 만들고 카드 폭에 맞춰 축소 ── */
  .vp { position: relative; filter: drop-shadow(0 18px 36px rgba(0,0,0,.45)); }
  .vp-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .cf-card:not(.is-center) .vp-in { pointer-events: none; }
  .cf-card.is-center { cursor: default; }
  .pn { position: relative; font-family: 'Exo', 'Noto Sans KR', sans-serif; color: #fff; line-height: 1.33; transform-origin: 50% 50%; -webkit-font-smoothing: antialiased; }
  .pn .abs { position: absolute; }
  .pn svg { display: block; overflow: visible; }
  .pn button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pn button:focus-visible { outline: 3px solid #03dac6; outline-offset: 4px; }
  .pn .ctr { left: 0; right: 0; text-align: center; white-space: pre-line; }
  .pn { word-break: keep-all; }
  .pn .ctr, .pn .tut-body { pointer-events: none; }
  .pn.is-closing { animation: pnOut .26s ease-in forwards; }
  .pn.is-opening { animation: pnIn .42s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pnOut { to { opacity: 0; transform: scale(.94); } }
  @keyframes pnIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

  /* 1. 인 게임 메뉴 열기 — 제스처 진행 */
  .gs-hand { transition: transform .32s cubic-bezier(.3,.7,.3,1); }
  .gs-box rect { transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0); opacity: 0; transition: transform .26s cubic-bezier(.3,1.5,.5,1), opacity .2s; }
  .gs-box.on rect { transform: scale(1); opacity: 1; }
  .gs-done .gs-box path { fill: #03dac6; transition: fill .2s; }
  .gs-done .gs-box rect { fill: #03dac6; }

  /* 2·4. 팝업 공통 버튼 (Btn - Reset: Normal / hover / 눌림) */
  .btn-sq .sh { fill: #000; fill-opacity: .8; stroke: #c6cacc; transition: fill .15s, fill-opacity .15s, stroke .15s; }
  .btn-sq .ic { fill: #fff; transition: fill .15s; }
  .btn-sq:hover .sh { fill-opacity: 1; }
  .btn-sq:active .sh { fill: #002c1f; fill-opacity: .8; stroke: #03dac6; }
  .btn-sq:active .ic { fill: #03dac6; }
  .btn-txt { transition: color .15s, transform .1s; text-shadow: 0 0 4px rgba(0,0,0,.25); }
  .btn-txt:hover { color: #03dac6; }
  .btn-txt:active { transform: scale(.94); }
  .tut-body { transition: opacity .22s ease, transform .22s ease; }
  .tut-body.is-out { opacity: 0; transform: translateY(10px); }

  /* 3. Type list */
  .tl-row { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; touch-action: pan-x pan-y; }
  .tl-row::-webkit-scrollbar { display: none; }
  .tl-row.is-drag { cursor: grabbing; }
  .tl-row.is-drag .tl-it { pointer-events: none; }
  .tl-it { position: relative; flex: none; width: 256px; height: 276px; transition: transform .12s; }
  .tl-it .sh-def, .tl-it .sh-sel, .tl-it .gl { position: absolute; left: 0; top: 0; transition: opacity .25s; }
  .tl-it .sh-def path { transition: stroke .15s, fill-opacity .15s; }
  .tl-it .sh-sel, .tl-it .gl { opacity: 0; }
  .tl-it .gl1 { left: 37px; top: 62px; width: 181px; height: 119px; background: #ff5f00; filter: blur(30px); }
  .tl-it .gl2 { left: 20px; top: 212px; width: 216px; height: 32px; background: #ff5f00; filter: blur(11.5px); }
  .tl-it .ico { position: absolute; left: 68px; top: 54px; width: 120px; height: 120px; transition: transform .32s cubic-bezier(.3,1.3,.5,1); }
  .tl-it .ico svg { width: 100%; height: 100%; }
  .tl-it .lb { position: absolute; left: 0; right: 0; top: 196px; height: 64px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 500; font-size: 24px; white-space: pre-line; }
  .tl-it .lock { position: absolute; left: 98px; top: 108px; width: 60px; height: 60px; }
  .tl-it:not([aria-disabled="true"]):hover .sh-def path { stroke: #ff5f00; fill-opacity: .75; }
  .tl-it:not([aria-disabled="true"]):active { transform: scale(.97); }
  .tl-it.is-sel .sh-sel, .tl-it.is-sel .gl { opacity: 1; }
  .tl-it.is-sel .sh-def { opacity: 0; }
  .tl-it.is-sel .ico { transform: scale(1.5); }
  .tl-it[aria-disabled="true"] { cursor: not-allowed; }
  .tl-it[aria-disabled="true"] .lb { color: #4f4f4f; }
  .btn-x path { fill: #c6cacc; transition: fill .15s; }
  .btn-x:hover path { fill: #ff5f00; }
  .btn-x:active { transform: scale(.92); }
  .sb-thumb { background: #fff; opacity: .5; border-radius: 4px; touch-action: none; }
  .sb-thumb.is-live { cursor: grab; }

  /* 4. 경고 — 등장 모션만 */
  .pn.play .wn-ic { animation: wnIc .5s cubic-bezier(.3,1.5,.5,1) both .08s; }
  .pn.play .wn-tt { animation: wnUp .4s ease both .14s; }
  .pn.play .wn-st { animation: wnUp .4s ease both .24s; }
  .pn.play .wn-bd { animation: wnUp .4s ease both .32s; }
  @keyframes wnIc { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes wnUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* 5. 사양 비교 */
  .dm-scroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; }
  .dm-scroll::-webkit-scrollbar { display: none; }
  .dm-tb { position: absolute; top: 0; width: 480px; table-layout: fixed; border-collapse: separate; border-spacing: 0 4px; margin: 0; font-size: 16px; font-weight: 500; line-height: 21px; }
  /* 머리줄은 스크롤 밖에 고정해 그리고(dm-head), 표 안 thead 는 화면에서만 숨겨 읽기 프로그램용으로 둔다 */
  .dm-tb th { height: 0; padding: 0; border: 0; font-size: 0; line-height: 0; overflow: hidden; }
  .dm-head { display: flex; align-items: center; width: 480px; height: 40px; padding-left: 40px; box-sizing: border-box; background: rgba(0,0,0,.3); font-size: 16px; font-weight: 500; line-height: 21px; color: #90989c; }
  .dm-head span { flex: none; }
  .dm-tb td { height: 70px; padding: 0; color: #e1e3e4; background: rgba(0,0,0,.5); border-top: 1px solid var(--rs); border-bottom: 1px solid var(--rs); vertical-align: middle; }
  .dm-tb td:first-child { padding-left: 40px; border-left: 1px solid var(--rs); }
  .dm-tb td:last-child { border-right: 1px solid var(--rs); }
  .dm-tb tr.h68 td { height: 66px; }
  .dm-vs { background: linear-gradient(#eef0f0, #90989c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 2px rgba(0,0,0,.25)); }
  @media (prefers-reduced-motion: reduce) { .pn, .pn * { animation: none !important; transition: none !important; } }
  .cf-card figcaption { position: absolute; left: 0; right: 0; top: 100%; margin-top: 12px; text-align: center; font-size: 13px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); opacity: 0; transition: opacity .25s ease; }
  .cf-card.is-center figcaption { opacity: 1; }
  .cf-nav { position: absolute; top: 46%; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); cursor: pointer; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .cf-nav::before { content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border-left: 2px solid #26282c; border-bottom: 2px solid #26282c; transform: translate(-30%, -50%) rotate(45deg); }
  .cf-prev { left: 16px; }
  .cf-next { right: 16px; }
  .cf-next::before { transform: translate(-70%, -50%) rotate(-135deg); }
  .cf-nav:disabled { opacity: .35; cursor: default; }
  .cf-dots { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 8px; z-index: 5; }
  .cf-dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; transition: width .25s ease, background .25s ease; }
  .cf-dots button.is-on { width: 22px; border-radius: 4px; background: #fff; }
  @media (max-width: 640px) { .vr360 { height: 480px; } h2 { font-size: 24px; } }
</style>
</head>

  // 스크롤: 휠은 패널 안에서만 쓰고 페이지·카드로 새지 않음. 막대는 피그마 디자인 그대로, 내용이 넘칠 때 실제 위치·길이를 따른다
  function bindScroll(sc, th, axis, t0, tLen) {
    var X = axis === 'x', drag = null;
    function over() { return X ? sc.scrollWidth - sc.clientWidth : sc.scrollHeight - sc.clientHeight; }
    function sync() {
      var m = over(); th.classList.toggle('is-live', m > 1);
      if (m <= 1) return; // 넘치지 않으면 피그마 위치·길이 그대로 둔다
      var cl = X ? sc.clientWidth : sc.clientHeight, all = cl + m, len = Math.max(40, tLen * cl / all);

      if (X) { th.style.width = len + 'px'; th.style.left = p + 'px'; } else { th.style.height = len + 'px'; th.style.top = p + 'px'; }
    }
    sc.addEventListener('scroll', sync); window.addEventListener('resize', sync); sync();
    sc.addEventListener('wheel', function (e) {
      // 이 스크롤 대상의 축 방향 휠만 가로챈다. 넘치는 내용이 없거나 다른 축이면 그대로 흘려 보낸다
      // 가로 목록(X)은 세로 휠도 가로로 바꿔 쓴다. 세로 휠은 목록 끝에 닿으면 페이지로 넘겨 준다
      var horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY), m = over();

      e.preventDefault(); e.stopPropagation();
      if (X) sc.scrollLeft += d; else sc.scrollTop += d;
    }, { passive: false });
    th.addEventListener('pointerdown', function (e) {
      if (over() <= 1) return;
      e.preventDefault(); e.stopPropagation(); th.setPointerCapture(e.pointerId);
      drag = { p: X ? e.clientX : e.clientY, s: X ? sc.scrollLeft : sc.scrollTop };
    });
    th.addEventListener('pointermove', function (e) {
      if (!drag) return;

  }
