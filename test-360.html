<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360 배경 테스트 — 정비 VR</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; font-family: 'Pretendard', system-ui, sans-serif; }
  #wrap { position: relative; height: 100%; overflow: hidden; cursor: grab; touch-action: none; }
  #wrap.drag { cursor: grabbing; }
  canvas { display: block; }
  .hint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font-size: 13px; pointer-events: none; transition: opacity .4s; }
  .panel { position: absolute; left: 50%; top: 50%; width: 360px; transform: translate(-50%, -50%); pointer-events: none; }
  .panel img { width: 100%; display: block; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #ddd; font-size: 15px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="msg" id="msg">360 이미지를 불러오는 중…</div>
  <div class="hint" id="hint">드래그해서 둘러보기</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var SRC = 'assets/pano/vr-maint-360.webp';
  var wrap = document.getElementById('wrap'), msg = document.getElementById('msg'), hint = document.getElementById('hint');
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  wrap.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
  var geo = new THREE.SphereGeometry(500, 64, 40); geo.scale(-1, 1, 1);
  var mat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  scene.add(new THREE.Mesh(geo, mat));
  new THREE.TextureLoader().load(SRC, function (tex) {
    if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true; msg.remove();
  }, undefined, function () { msg.textContent = '360 이미지를 찾을 수 없습니다: ' + SRC; });

  var lon = 180, lat = 0, vLon = 0, vLat = 0, down = false, px = 0, py = 0, auto = true;
  var HFOV = 80; // 가로 시야 고정(넓은 화면에서 가장자리 휨 방지)
  function applyFov() { var a = camera.aspect, v = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(HFOV) / 2) / a); camera.fov = Math.min(75, THREE.MathUtils.radToDeg(v)); camera.updateProjectionMatrix(); }
  function size() { var w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; applyFov(); }
  window.addEventListener('resize', size); size();
  wrap.addEventListener('pointerdown', function (e) { down = true; auto = false; px = e.clientX; py = e.clientY; wrap.setPointerCapture(e.pointerId); wrap.classList.add('drag'); hint.style.opacity = 0; });
  wrap.addEventListener('pointermove', function (e) { if (!down) return; vLon = (px - e.clientX) * 0.12; vLat = (e.clientY - py) * 0.12; lon += vLon; lat += vLat; px = e.clientX; py = e.clientY; });
  wrap.addEventListener('pointerup', function () { down = false; wrap.classList.remove('drag'); });
  wrap.addEventListener('wheel', function (e) { e.preventDefault(); HFOV = Math.max(50, Math.min(90, HFOV + e.deltaY * 0.03)); applyFov(); }, { passive: false });
  (function loop() {
    if (!down) { lon += vLon; lat += vLat; vLon *= 0.93; vLat *= 0.93; if (auto) lon += 0.04; }
    lat = Math.max(-15, Math.min(15, lat));
    var phi = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon);
    camera.lookAt(500 * Math.sin(phi) * Math.cos(th), 500 * Math.cos(phi), 500 * Math.sin(phi) * Math.sin(th));
    renderer.render(scene, camera); requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
