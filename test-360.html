<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360 배경 테스트 — 정비 VR</title>
<style>
  :root { --ink: #1A1B1F; --sub: #6B6C72; }
  html, body { margin: 0; background: #fff; color: var(--ink); font-family: 'Pretendard', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .sec { padding: 72px 0; }
  .label { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; }
  h2 { margin: 0 0 12px; font-size: 32px; letter-spacing: -.02em; }
  .desc { margin: 0 0 28px; max-width: 640px; font-size: 16px; line-height: 1.6; color: #4A4B50; }

  .vr360 { position: relative; height: 640px; border-radius: 20px; overflow: hidden; background: #1b1f24; user-select: none; -webkit-user-select: none; outline: none; }
  .vr360 canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .vr360 .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #ddd; font-size: 15px; }
  /* 커버 플로 카드 */
  .cf-stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 45%; cursor: grab; touch-action: pan-y; z-index: 2; }
  .cf-stage.is-drag { cursor: grabbing; }
  .cf-card { position: absolute; left: 50%; top: 46%; margin: 0; transform-style: preserve-3d; will-change: transform, filter, opacity; cursor: pointer; }
  .cf-card img { display: block; width: 100%; height: auto; pointer-events: none; filter: drop-shadow(0 18px 36px rgba(0,0,0,.45)); }
  .cf-card figcaption { position: absolute; left: 0; right: 0; top: 100%; margin-top: 12px; text-align: center; font-size: 13px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); opacity: 0; transition: opacity .25s ease; }
  .cf-card.is-center figcaption { opacity: 1; }
  .cf-nav { position: absolute; top: 46%; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); cursor: pointer; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .cf-nav::before { content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border-left: 2px solid #26282c; border-bottom: 2px solid #26282c; transform: translate(-30%, -50%) rotate(45deg); }
  .cf-prev { left: 16px; }
  .cf-next { right: 16px; }
  .cf-next::before { transform: translate(-70%, -50%) rotate(-135deg); }
  .cf-nav:disabled { opacity: .35; cursor: default; }
  .cf-dots { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 8px; z-index: 5; }
  .cf-dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; transition: width .25s ease, background .25s ease; }
  .cf-dots button.is-on { width: 22px; border-radius: 4px; background: #fff; }
  @media (max-width: 640px) { .vr360 { height: 480px; } h2 { font-size: 24px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="container">
    <p class="label">VR SPACE UI</p>
    <h2>정비장 공간 속 UI</h2>
    <p class="desc">헤드셋 안 정비장 공간에 떠 있는 패널을 카드로 넘겨 봅니다. 드래그하거나 화살표·점을 누르면 카드가 돌아가고, 뒤의 공간도 그 방향으로 함께 돕니다.</p>
    <div class="vr360" id="vr360" tabindex="0" role="region" aria-roledescription="carousel" aria-label="정비 VR 패널">
      <div class="msg" id="msg">360 이미지를 불러오는 중…</div>
      <div class="cf-stage" id="stage">
        <figure class="cf-card" data-w="400"><img src="assets/comp/vr-maintenance/info-popup.png" alt="인 게임 메뉴 열기 안내" draggable="false"><figcaption>인 게임 메뉴 열기 안내</figcaption></figure>
        <figure class="cf-card" data-w="400"><img src="assets/comp/vr-maintenance/tutorial-dialog.png" alt="튜토리얼 팝업" draggable="false"><figcaption>튜토리얼 팝업</figcaption></figure>
        <figure class="cf-card" data-w="560"><img src="assets/comp/vr-maintenance/type-list-popup.webp" alt="장비 유형 선택 팝업" draggable="false"><figcaption>장비 유형 선택 팝업</figcaption></figure>
        <figure class="cf-card" data-w="400"><img src="assets/comp/vr-maintenance/warning-popup.webp" alt="경고 팝업" draggable="false"><figcaption>경고 팝업</figcaption></figure>
        <figure class="cf-card" data-w="460"><img src="assets/comp/vr-maintenance/dimensions-compare-panel.webp" alt="사양 비교 패널" draggable="false"><figcaption>사양 비교 패널</figcaption></figure>
      </div>
      <button type="button" class="cf-nav cf-prev" aria-label="이전 패널"></button>
      <button type="button" class="cf-nav cf-next" aria-label="다음 패널"></button>
      <div class="cf-dots" id="dots"></div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var SRC = 'assets/pano/vr-maint-360.webp?v=6';
  var box = document.getElementById('vr360'), stage = document.getElementById('stage'), msg = document.getElementById('msg');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 360 배경
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  box.insertBefore(renderer.domElement, box.firstChild);
  var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1100);
  var geo = new THREE.SphereGeometry(500, 64, 40); geo.scale(-1, 1, 1);
  var mat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  scene.add(new THREE.Mesh(geo, mat));
  new THREE.TextureLoader().load(SRC, function (tex) {
    if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true; msg.remove();
  }, undefined, function () { msg.textContent = '360 이미지를 찾을 수 없습니다'; });
  var HFOV = 80;
  function size() { var w = box.clientWidth, h = box.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; var v = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(HFOV) / 2) / camera.aspect); camera.fov = Math.min(70, THREE.MathUtils.radToDeg(v)); camera.updateProjectionMatrix(); }
  window.addEventListener('resize', size); size();

  // 카드
  var cards = [].slice.call(stage.querySelectorAll('.cf-card')), n = cards.length;
  var dotsBox = document.getElementById('dots'), prev = box.querySelector('.cf-prev'), next = box.querySelector('.cf-next');
  cards.forEach(function (c, i) {
    c.style.width = c.dataset.w + 'px'; c.style.marginLeft = (-c.dataset.w / 2) + 'px';
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', (i + 1) + '번째 패널');
    b.addEventListener('click', function () { go(i); }); dotsBox.appendChild(b);
  });
  var dots = [].slice.call(dotsBox.children);
  var mid = Math.floor(n / 2), pos = mid, target = mid, GAP = 300, STEP = 14; // 카드 한 장마다 배경이 도는 각도
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function place() {
    var scale = Math.min(1, box.clientWidth / 1100);
    cards.forEach(function (c, i) {
      var d = i - pos, ad = Math.abs(d), sd = clamp(d, -1, 1);
      c.style.transform = 'translateY(-50%) translateX(' + (d * GAP * scale) + 'px) translateZ(' + (-ad * 140) + 'px) rotateY(' + (sd * 32) + 'deg) scale(' + (Math.max(0.55, 1 - ad * 0.2) * scale) + ')';
      c.style.filter = 'brightness(' + (1 - Math.min(ad, 3) * 0.18) + ')';
      c.style.opacity = String(ad > 2.4 ? Math.max(0, 3.2 - ad) : 1);
      c.style.zIndex = String(100 - Math.round(ad * 10));
      c.classList.toggle('is-center', ad < 0.5);
    });
    var k = Math.round(clamp(pos, 0, n - 1));
    dots.forEach(function (b, i) { b.classList.toggle('is-on', i === k); });
    prev.disabled = target <= 0; next.disabled = target >= n - 1;
  }
  function go(k) { target = clamp(Math.round(k), 0, n - 1); }
  prev.addEventListener('click', function () { go(target - 1); });
  next.addEventListener('click', function () { go(target + 1); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { go(target - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { go(target + 1); e.preventDefault(); }
  });

  var down = false, sx = 0, sp = 0, moved = 0, lastX = 0, lastT = 0, vel = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    down = true; moved = 0; sx = lastX = e.clientX; lastT = performance.now(); sp = pos; vel = 0;
    stage.setPointerCapture(e.pointerId); stage.classList.add('is-drag');
  });
  stage.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx));
    var now = performance.now(); vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
    pos = clamp(sp - dx / GAP, -0.4, n - 0.6); target = pos;
  });
  function up(e) {
    if (!down) return;
    down = false; stage.classList.remove('is-drag');
    if (moved < 6) {
      stage.releasePointerCapture && stage.releasePointerCapture(e.pointerId);
      var el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest('.cf-card');
      go(c ? cards.indexOf(c) : target); return;
    }
    go(pos - vel * 0.35);
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);

  // 배경은 카드 위치를 따라 돈다(가운데 카드 = 굴삭기 정면)
  var BASE = 180, lon = BASE, idle = 0;
  (function loop() {
    if (!down) pos += (target - pos) * (reduce ? 1 : 0.12);
    var goalLon = BASE + (pos - mid) * STEP;
    lon += (goalLon - lon) * (reduce ? 1 : 0.08);
    idle += reduce ? 0 : 0.004;
    var lat = Math.sin(idle) * 1.2, phi = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon + Math.sin(idle * 0.7) * 1.5);
    camera.lookAt(500 * Math.sin(phi) * Math.cos(th), 500 * Math.cos(phi), 500 * Math.sin(phi) * Math.sin(th));
    renderer.render(scene, camera);
    place();
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
